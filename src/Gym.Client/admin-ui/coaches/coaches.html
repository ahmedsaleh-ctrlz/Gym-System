<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Coaches</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="../shared/ui.css">
    <link rel="stylesheet" href="coaches.css" />
  </head>

  <body>
    <div class="dashboard">
      <!-- Sidebar -->

      <aside class="sidebar">
        <div>
          <h2 class="logo">GYM SYSTEM</h2>

          <ul class="nav-links">
            <li>
              <a href="../dashboard/dashboard.html">
                <i class="bi bi-grid-fill"></i>
                Dashboard
              </a>
            </li>

            <li>
              <a href="../members/members.html">
                <i class="bi bi-people-fill"></i>

                Members
              </a>
            </li>

            <li class="active">
              <a href="../coaches/coaches.html">
                <i class="bi bi-person-workspace"></i>
                Coaches
              </a>
            </li>

            <li>
              <a href="../plans/plans.html">
                <i class="bi bi-box-fill"></i>

                Plans
              </a>
            </li>

            <li>
              <a href="../subscriptions/subscriptions.html">
                <i class="bi bi-calendar-check-fill"></i>

                Subscriptions
              </a>
            </li>

            <li>
              <a href="../payments/payments.html">
                <i class="bi bi-cash-stack"></i>
                Payments
              </a>
            </li>

            <li>
              <a href="../attendance/attendance.html">
                <i class="bi bi-activity"></i>
                Attendance
              </a>
            </li>
          </ul>
        </div>

        <button class="logout-btn" onclick="logout()">
          <i class="bi bi-box-arrow-right"></i>
          Logout
        </button>
      </aside>

      <!-- Main -->

      <main class="main-content">
        <!-- Topbar -->

        <div class="topbar">
          <div>
            <h1>Coaches</h1>

            <p>Manage gym coaches</p>
          </div>

          <button
            class="btn add-btn"
            data-bs-toggle="modal"
            data-bs-target="#addCoachModal"
          >
            <i class="bi bi-plus-lg"></i>

            Add Coach
          </button>
        </div>

        <!-- Search -->

        <div class="search-box">
          <i class="bi bi-search"></i>

          <input type="text" id="searchInput" placeholder="Search coach..." />
        </div>

        <div class="filters-grid">
          <div class="filter-field">
            <label for="sortByFilter" class="filter-label">Sort By</label>
            <select id="sortByFilter" class="form-select">
              <option value="">Default</option>
              <option value="firstName">First Name</option>
              <option value="lastName">Last Name</option>
              <option value="hireDate">Hire Date</option>
            </select>
          </div>
          <div class="filter-field">
            <label for="sortDirectionFilter" class="filter-label">Sort Direction</label>
            <select id="sortDirectionFilter" class="form-select">
              <option value="asc">Ascending</option>
              <option value="desc">Descending</option>
            </select>
          </div>
        </div>

        <!-- Loading -->

        <div id="loadingSpinner" class="loading-container d-none">
          <div class="spinner-border text-danger"></div>
        </div>

        <!-- Empty -->

        <div id="emptyState" class="empty-state d-none">
          <i class="bi bi-person-workspace"></i>

          <h3>No Coaches Found</h3>
        </div>

        <!-- Cards -->

        <div class="coaches-grid" id="coachesGrid"></div>
      </main>
    </div>

    <!-- Add Coach Modal -->

    <div class="modal fade" id="addCoachModal" tabindex="-1">
      <div class="modal-dialog modal-lg">
        <div class="modal-content dark-modal">
          <div class="modal-header border-0">
            <h5 class="modal-title">Add Coach</h5>

            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
            ></button>
          </div>

          <div class="modal-body">
            <form id="addCoachForm">
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label class="form-label"> First Name </label>

                  <input
                    type="text"
                    id="firstName"
                    class="form-control"
                    required
                  />
                </div>

                <div class="col-md-6 mb-3">
                  <label class="form-label"> Last Name </label>

                  <input
                    type="text"
                    id="lastName"
                    class="form-control"
                    required
                  />
                </div>

                <div class="col-md-6 mb-3">
                  <label class="form-label"> Email </label>

                  <input
                    type="email"
                    id="email"
                    class="form-control"
                    required
                  />
                </div>

                <div class="col-md-6 mb-3">
                  <label class="form-label"> Password </label>

                  <input
                    type="password"
                    id="password"
                    class="form-control"
                    required
                  />
                </div>

                <div class="col-md-6 mb-3">
                  <label class="form-label"> Phone Number </label>

                  <input type="text" id="phoneNumber" class="form-control" />
                </div>

                <div class="col-md-6 mb-3">
                  <label class="form-label"> Image </label>

                  <input
                    type="file"
                    id="image"
                    class="form-control"
                    accept="image/*"
                    required
                  />
                </div>
              </div>

              <button type="submit" class="btn add-btn w-100">
                Create Coach
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- View Modal -->

    <div class="modal fade" id="viewCoachModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content dark-modal">
          <div class="modal-header border-0">
            <h5 class="modal-title">Coach Details</h5>

            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
            ></button>
          </div>

          <div class="modal-body">
            <div class="text-center mb-4">
              <img id="viewImage" class="coach-image-large" />
            </div>

            <div class="details-item">
              <span>Name</span>

              <strong id="viewName"></strong>
            </div>

            <div class="details-item">
              <span>Email</span>

              <strong id="viewEmail"></strong>
            </div>

            <div class="details-item">
              <span>Phone</span>

              <strong id="viewPhone"></strong>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../shared/ui.js"></script>
    <script src="coaches.js"></script>
  </body>
</html>
