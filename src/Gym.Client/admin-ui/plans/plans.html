<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Plans</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="../shared/ui.css">
    <link rel="stylesheet" href="plans.css" />
  </head>

  <body>
    <div class="dashboard">
      <!-- Sidebar -->

      <aside class="sidebar">
        <div>
          <h2 class="logo">GYM SYSTEM</h2>

          <ul class="nav-links">
            <li>
              <a href="../dashboard/dashboard.html">
                <i class="bi bi-grid-fill"></i>
                Dashboard
              </a>
            </li>
            <li>
              <a href="../members/members.html">
                <i class="bi bi-people-fill"></i>

                Members
              </a>
            </li>

            <li>
              <a href="../coaches/coaches.html">
                <i class="bi bi-person-workspace"></i>
                Coaches
              </a>
            </li>

            <li class="active">
              <a href="../plans/plans.html">
                <i class="bi bi-box-fill"></i>

                Plans
              </a>
            </li>

            <li>
              <a href="../subscriptions/subscriptions.html">
                <i class="bi bi-calendar-check-fill"></i>

                Subscriptions
              </a>
            </li>

            <li>
              <a href="../payments/payments.html">
                <i class="bi bi-cash-stack"></i>
                Payments
              </a>
            </li>

            <li>
              <a href="../attendance/attendance.html">
                <i class="bi bi-activity"></i>
                Attendance
              </a>
            </li>
          </ul>
        </div>

        <button class="logout-btn" onclick="logout()">
          <i class="bi bi-box-arrow-right"></i>
          Logout
        </button>
      </aside>

      <!-- Main -->

      <main class="main-content">
        <!-- Topbar -->

        <div class="topbar">
          <div>
            <h1>Plans</h1>

            <p>Manage gym subscription plans</p>
          </div>

          <button
            class="btn add-btn"
            data-bs-toggle="modal"
            data-bs-target="#addPlanModal"
          >
            <i class="bi bi-plus-lg"></i>

            Add Plan
          </button>
        </div>

        <!-- Search -->

        <div class="search-box">
          <i class="bi bi-search"></i>

          <input type="text" id="searchInput" placeholder="Search plan..." />
        </div>

        <div class="filters-grid">
          <div class="filter-field">
            <label for="sortByFilter" class="filter-label">Sort By</label>
            <select id="sortByFilter" class="form-select">
              <option value="">Default</option>
              <option value="title">Title</option>
              <option value="cost">Cost</option>
              <option value="durationInDays">Duration</option>
            </select>
          </div>
          <div class="filter-field">
            <label for="sortDirectionFilter" class="filter-label">Sort Direction</label>
            <select id="sortDirectionFilter" class="form-select">
              <option value="asc">Ascending</option>
              <option value="desc">Descending</option>
            </select>
          </div>
        </div>

        <!-- Loading -->

        <div id="loadingSpinner" class="loading-container d-none">
          <div class="spinner-border text-danger"></div>
        </div>

        <!-- Empty -->

        <div id="emptyState" class="empty-state d-none">
          <i class="bi bi-box"></i>

          <h3>No Plans Found</h3>
        </div>

        <!-- Plans Grid -->

        <div class="plans-grid" id="plansGrid"></div>
      </main>
    </div>

    <!-- Add Plan Modal -->

    <div class="modal fade" id="addPlanModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content dark-modal">
          <div class="modal-header border-0">
            <h5 class="modal-title">Add Plan</h5>

            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
            ></button>
          </div>

          <div class="modal-body">
            <form id="addPlanForm">
              <div class="mb-3">
                <label class="form-label"> Title </label>

                <input type="text" id="title" class="form-control" required />
              </div>

              <div class="mb-3">
                <label class="form-label"> Description </label>

                <textarea id="description" class="form-control"></textarea>
              </div>

              <div class="mb-3">
                <label class="form-label"> Cost </label>

                <input type="number" id="cost" class="form-control" />
              </div>

              <div class="mb-3">
                <label class="form-label"> Duration In Days </label>

                <input type="number" id="durationInDays" class="form-control" />
              </div>

              <div class="mb-3">
                <label class="form-label"> Allowed Freeze Count </label>

                <input
                  type="number"
                  id="allowedFreezeCount"
                  class="form-control"
                />
              </div>

              <div class="mb-4">
                <label class="form-label"> Max Freeze Days </label>

                <input
                  type="number"
                  id="maxTotalFreezeDays"
                  class="form-control"
                />
              </div>

              <button type="submit" class="btn add-btn w-100">
                Create Plan
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Edit Modal -->

    <div class="modal fade" id="editPlanModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content dark-modal">
          <div class="modal-header border-0">
            <h5 class="modal-title">Edit Plan</h5>

            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
            ></button>
          </div>

          <div class="modal-body">
            <form id="editPlanForm">
              <input type="hidden" id="editPlanId" />

              <div class="mb-3">
                <label class="form-label"> Title </label>

                <input type="text" id="editTitle" class="form-control" />
              </div>

              <div class="mb-3">
                <label class="form-label"> Description </label>

                <textarea id="editDescription" class="form-control"></textarea>
              </div>

              <div class="mb-3">
                <label class="form-label"> Cost </label>

                <input type="number" id="editCost" class="form-control" />
              </div>

              <div class="mb-3">
                <label class="form-label"> Duration In Days </label>

                <input
                  type="number"
                  id="editDurationInDays"
                  class="form-control"
                />
              </div>

              <div class="mb-3">
                <label class="form-label"> Allowed Freeze Count </label>

                <input
                  type="number"
                  id="editAllowedFreezeCount"
                  class="form-control"
                />
              </div>

              <div class="mb-4">
                <label class="form-label"> Max Freeze Days </label>

                <input
                  type="number"
                  id="editMaxTotalFreezeDays"
                  class="form-control"
                />
              </div>

              <button type="submit" class="btn add-btn w-100">
                Save Changes
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../shared/ui.js"></script>
    <script src="plans.js"></script>
  </body>
</html>
