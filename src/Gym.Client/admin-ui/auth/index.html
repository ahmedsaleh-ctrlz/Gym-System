<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Gym Auth</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="overlay"></div>

    <div class="auth-container">
      <div class="auth-card">
        <!-- Tabs -->

        <div class="tabs">
          <button class="tab-btn active" id="loginTab">Login</button>

          <button class="tab-btn" id="registerTab">Register</button>
        </div>

        <!-- Login Form -->

        <div id="loginSection">
          <h1 class="title">GYM SYSTEM</h1>

          <p class="subtitle">Sign in to continue</p>

          <div id="loginError" class="alert alert-danger d-none">
            Invalid email or password
          </div>

          <form id="loginForm">
            <div class="mb-3">
              <label class="form-label"> Email </label>

              <input
                type="email"
                id="loginEmail"
                class="form-control"
                required
              />
            </div>

            <div class="mb-4">
              <label class="form-label"> Password </label>

              <div class="password-wrapper">
                <input
                  type="password"
                  id="loginPassword"
                  class="form-control"
                  required
                />

                <button
                  type="button"
                  class="show-btn"
                  onclick="togglePassword('loginPassword', this)"
                >
                  Show
                </button>
              </div>
            </div>

            <button type="submit" class="btn btn-auth w-100" id="loginBtn">
              Login
            </button>
          </form>
        </div>

        <!-- Register Form -->

        <div id="registerSection" class="d-none">
          <h1 class="title">CREATE ACCOUNT</h1>

          <p class="subtitle">Join the gym system</p>

          <div id="registerError" class="alert alert-danger d-none">
            Failed to create account
          </div>

          <form id="registerForm">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label"> First Name </label>

                <input
                  type="text"
                  id="firstName"
                  class="form-control"
                  required
                />
              </div>

              <div class="col-md-6 mb-3">
                <label class="form-label"> Last Name </label>

                <input
                  type="text"
                  id="lastName"
                  class="form-control"
                  required
                />
              </div>

              <div class="col-md-6 mb-3">
                <label class="form-label"> Email </label>

                <input
                  type="email"
                  id="registerEmail"
                  class="form-control"
                  required
                />
              </div>

              <div class="col-md-6 mb-3">
                <label class="form-label"> Password </label>

                <input
                  type="password"
                  id="registerPassword"
                  class="form-control"
                  required
                />
              </div>

              <div class="col-md-6 mb-3">
                <label class="form-label"> Phone Number </label>

                <input type="text" id="phoneNumber" class="form-control" />
              </div>

              <div class="col-md-6 mb-3">
                <label class="form-label"> Date Of Birth </label>

                <input type="date" id="dateOfBirth" class="form-control" />
              </div>

              <div class="col-md-6 mb-3">
                <label class="form-label"> Join Date </label>

                <input type="date" id="joinDate" class="form-control" />
              </div>

              <div class="col-md-6 mb-3">
                <label class="form-label"> Image </label>

                <input type="file" id="image" class="form-control" required />
              </div>

              <div class="col-12 mb-3">
                <label class="form-label"> Notes </label>

                <textarea id="notes" class="form-control"></textarea>
              </div>
            </div>

            <button type="submit" class="btn btn-auth w-100" id="registerBtn">
              Create Account
            </button>
          </form>
        </div>
      </div>
    </div>
    
    <script src="../shared/ui.js"></script>
    <script src="app.js"></script>
  </body>
</html>
