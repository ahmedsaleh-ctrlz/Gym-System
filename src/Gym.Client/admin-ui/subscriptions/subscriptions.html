<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Subscriptions</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="../shared/ui.css">
    <link rel="stylesheet" href="subscriptions.css" />
  </head>

  <body>
    <div class="dashboard">
      <!-- Sidebar -->

      <aside class="sidebar">
        <div>
          <h2 class="logo">GYM SYSTEM</h2>

          <ul class="nav-links">
            <li>
              <a href="../dashboard/dashboard.html">
                <i class="bi bi-grid-fill"></i>
                Dashboard
              </a>
            </li>

            <li>
              <a href="../members/members.html">
                <i class="bi bi-people-fill"></i>

                Members
              </a>
            </li>

            <li>
              <a href="../coaches/coaches.html">
                <i class="bi bi-person-workspace"></i>
                Coaches
              </a>
            </li>

            <li>
              <a href="../plans/plans.html">
                <i class="bi bi-box-fill"></i>

                Plans
              </a>
            </li>

            <li class="active">
              <a href="../subscriptions/subscriptions.html">
                <i class="bi bi-calendar-check-fill"></i>

                Subscriptions
              </a>
            </li>

            <li>
              <a href="../payments/payments.html">
                <i class="bi bi-cash-stack"></i>
                Payments
              </a>
            </li>

            <li>
              <a href="../attendance/attendance.html">
                <i class="bi bi-activity"></i>
                Attendance
              </a>
            </li>
          </ul>
        </div>

        <button class="logout-btn" onclick="logout()">
          <i class="bi bi-box-arrow-right"></i>
          Logout
        </button>
      </aside>

      <!-- Main -->

      <main class="main-content">
        <!-- Topbar -->

        <div class="topbar">
          <div>
            <h1>Subscriptions</h1>

            <p>Manage member subscriptions</p>
          </div>
        </div>

        <!-- Filters -->

        <div class="filters-grid">
          <div class="filter-field">
            <label for="searchInput" class="filter-label">Search</label>
            <input
              type="text"
              id="searchInput"
              class="form-control"
              placeholder="Member name..."
            />
          </div>

          <div class="filter-field">
            <label for="statusFilter" class="filter-label">Status</label>
            <select id="statusFilter" class="form-select">
              <option value="">All Status</option>
              <option value="Pending">Pending</option>
              <option value="Active">Active</option>
              <option value="Expired">Expired</option>
              <option value="Frozen">Frozen</option>
              <option value="Cancelled">Cancelled</option>
              <option value="Scheduled">Scheduled</option>
            </select>
          </div>

          <div class="filter-field">
            <label for="planNameFilter" class="filter-label">Plan Name</label>
            <input
              type="text"
              id="planNameFilter"
              class="form-control"
              placeholder="Gold, Silver..."
            />
          </div>

          <div class="filter-field">
            <label for="startDateFromFilter" class="filter-label">Start Date From</label>
            <input type="date" id="startDateFromFilter" class="form-control" />
          </div>

          <div class="filter-field">
            <label for="startDateToFilter" class="filter-label">Start Date To</label>
            <input type="date" id="startDateToFilter" class="form-control" />
          </div>

          <div class="filter-field">
            <label for="endDateFromFilter" class="filter-label">End Date From</label>
            <input type="date" id="endDateFromFilter" class="form-control" />
          </div>

          <div class="filter-field">
            <label for="endDateToFilter" class="filter-label">End Date To</label>
            <input type="date" id="endDateToFilter" class="form-control" />
          </div>

          <div class="filter-field">
            <label for="sortByFilter" class="filter-label">Sort By</label>
            <select id="sortByFilter" class="form-select">
              <option value="">Default</option>
              <option value="startDate">Start Date</option>
              <option value="endDate">End Date</option>
              <option value="memberName">Member Name</option>
              <option value="planName">Plan Name</option>
              <option value="status">Status</option>
            </select>
          </div>

          <div class="filter-field">
            <label for="sortDirectionFilter" class="filter-label">Sort Direction</label>
            <select id="sortDirectionFilter" class="form-select">
              <option value="asc">Ascending</option>
              <option value="desc">Descending</option>
            </select>
          </div>
        </div>

        <!-- Loading -->

        <div id="loadingSpinner" class="loading-container d-none">
          <div class="spinner-border text-danger"></div>
        </div>

        <!-- Table -->

        <div class="table-container">
          <table class="table">
            <thead>
              <tr>
                <th>Member</th>

                <th>Plan</th>

                <th>Price</th>

                <th>Start</th>

                <th>End</th>

                <th>Status</th>

                <th>Actions</th>
              </tr>
            </thead>

            <tbody id="subscriptionsTable"></tbody>
          </table>
        </div>
      </main>
    </div>

    <div class="modal fade" id="freezeSubscriptionModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content dark-modal">
          <div class="modal-header border-0">
            <h5 class="modal-title">Freeze Subscription</h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <form id="freezeSubscriptionForm">
              <input type="hidden" id="freezeSubscriptionId" />
              <div class="mb-4">
                <label for="freezeDaysInput" class="form-label">Freeze Days</label>
                <input
                  type="number"
                  id="freezeDaysInput"
                  class="form-control"
                  min="1"
                  required
                  placeholder="Enter number of days"
                />
              </div>
              <button type="submit" class="btn add-btn w-100">
                Confirm Freeze
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../shared/ui.js"></script>
    <script src="subscriptions.js"></script>
  </body>
</html>
