<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Attendance</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="../shared/ui.css">
    <link rel="stylesheet" href="attendance.css" />
  </head>

  <body>
    <div class="dashboard">
      <!-- Sidebar -->

      <aside class="sidebar">
        <div>
          <h2 class="logo">GYM SYSTEM</h2>

          <ul class="nav-links">
            <li>
              <a href="../dashboard/dashboard.html">
                <i class="bi bi-grid-fill"></i>
                Dashboard
              </a>
            </li>

            <li>
              <a href="../members/members.html">
                <i class="bi bi-people-fill"></i>

                Members
              </a>
            </li>

            <li>
              <a href="../coaches/coaches.html">
                <i class="bi bi-person-workspace"></i>
                Coaches
              </a>
            </li>

            <li>
              <a href="../plans/plans.html">
                <i class="bi bi-box-fill"></i>

                Plans
              </a>
            </li>

            <li>
              <a href="../subscriptions/subscriptions.html">
                <i class="bi bi-calendar-check-fill"></i>

                Subscriptions
              </a>
            </li>

            <li>
              <a href="../payments/payments.html">
                <i class="bi bi-cash-stack"></i>
                Payments
              </a>
            </li>

            <li class="active">
              <a href="../attendance/attendance.html">
                <i class="bi bi-activity"></i>
                Attendance
              </a>
            </li>
          </ul>
        </div>

        <button class="logout-btn" onclick="logout()">
          <i class="bi bi-box-arrow-right"></i>
          Logout
        </button>
      </aside>

      <!-- Main -->

      <main class="main-content">
        <div class="topbar">
          <div>
            <h1>Attendance</h1>

            <p>Check in active members</p>
          </div>
        </div>

        <!-- Stats -->

        <div class="stats-grid">
          <div class="stat-card">
            <span> Today Attendance </span>

            <h2 id="todayAttendance">0</h2>
          </div>

          <div class="stat-card">
            <span> Active Members </span>

            <h2 id="activeMembers">0</h2>
          </div>
        </div>

        <!-- Search -->

        <div class="search-box">
          <i class="bi bi-search"></i>

          <input
            type="text"
            id="searchInput"
            placeholder="Search by member id, name, or phone..."
          />
        </div>

        <!-- Loading -->

        <div id="loadingSpinner" class="loading-container d-none">
          <div class="spinner-border text-danger"></div>
        </div>

        <!-- Empty -->

        <div id="emptyState" class="empty-state d-none">
          <i class="bi bi-activity"></i>

          <h3>No Active Members Found</h3>
        </div>

        <!-- Table -->

        <div class="table-container">
          <table class="table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Image</th>
                <th>Member</th>
                <th>Phone</th>

                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>

            <tbody id="attendanceTable"></tbody>
          </table>
        </div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <script src="../shared/ui.js"></script>
    <script src="attendance.js"></script>
  </body>
</html>
