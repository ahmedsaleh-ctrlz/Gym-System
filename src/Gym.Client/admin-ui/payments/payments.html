<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Payments</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="../shared/ui.css">
    <link rel="stylesheet" href="payments.css" />
  </head>

  <body>
    <div class="dashboard">
      <!-- Sidebar -->

      <aside class="sidebar">
        <div>
          <h2 class="logo">GYM SYSTEM</h2>

          <ul class="nav-links">
            <li>
              <a href="../dashboard/dashboard.html">
                <i class="bi bi-grid-fill"></i>
                Dashboard
              </a>
            </li>

            <li>
              <a href="../members/members.html">
                <i class="bi bi-people-fill"></i>

                Members
              </a>
            </li>

            <li>
              <a href="../coaches/coaches.html">
                <i class="bi bi-person-workspace"></i>
                Coaches
              </a>
            </li>

            <li>
              <a href="../plans/plans.html">
                <i class="bi bi-box-fill"></i>

                Plans
              </a>
            </li>

            <li>
              <a href="../subscriptions/subscriptions.html">
                <i class="bi bi-calendar-check-fill"></i>

                Subscriptions
              </a>
            </li>

            <li class="active">
              <a href="../payments/payments.html">
                <i class="bi bi-cash-stack"></i>
                Payments
              </a>
            </li>

            <li>
              <a href="../attendance/attendance.html">
                <i class="bi bi-activity"></i>
                Attendance
              </a>
            </li>
          </ul>
        </div>

        <button class="logout-btn" onclick="logout()">
          <i class="bi bi-box-arrow-right"></i>
          Logout
        </button>
      </aside>

      <!-- Main -->

      <main class="main-content">
        <div class="topbar">
          <div>
            <h1>Payments</h1>

            <p>Manage gym payments</p>
          </div>
        </div>

        <!-- Stats -->

        <div class="stats-grid">
          <div class="stat-card">
            <span> Total Payments </span>

            <h2 id="paymentsCount">0</h2>
          </div>

          <div class="stat-card">
            <span> Total Revenue </span>

            <h2 id="totalRevenue">0 EGP</h2>
          </div>

          <div class="stat-card">
            <span> Paid Payments </span>

            <h2 id="paidPayments">0</h2>
          </div>

          <div class="stat-card">
            <span> Pending Payments </span>

            <h2 id="pendingPayments">0</h2>
          </div>
        </div>

        <!-- Search -->

        <div class="search-box">
          <i class="bi bi-search"></i>

          <input
            type="text"
            id="searchInput"
            placeholder="Search member, plan, method..."
          />
        </div>

        <div class="filters-grid">
          <div class="filter-field">
            <label for="statusFilter" class="filter-label">Status</label>
            <select id="statusFilter" class="form-select">
              <option value="">All Status</option>
              <option value="Paid">Paid</option>
              <option value="Failed">Failed</option>
              <option value="Pending">Pending</option>
              <option value="Refunded">Refunded</option>
            </select>
          </div>
          <div class="filter-field">
            <label for="sortByFilter" class="filter-label">Sort By</label>
            <select id="sortByFilter" class="form-select">
              <option value="">Default</option>
              <option value="paidAtUtc">Paid Date</option>
              <option value="amount">Amount</option>
              <option value="status">Status</option>
            </select>
          </div>
          <div class="filter-field">
            <label for="sortDirectionFilter" class="filter-label">Sort Direction</label>
            <select id="sortDirectionFilter" class="form-select">
              <option value="desc">Descending</option>
              <option value="asc">Ascending</option>
            </select>
          </div>
        </div>

        <!-- Loading -->

        <div id="loadingSpinner" class="loading-container d-none">
          <div class="spinner-border text-danger"></div>
        </div>

        <!-- Empty -->

        <div id="emptyState" class="empty-state d-none">
          <i class="bi bi-cash-stack"></i>

          <h3>No Payments Found</h3>
        </div>

        <!-- Table -->

        <div class="table-container">
          <table class="table">
            <thead>
              <tr>
                <th>Member</th>

                <th>Plan</th>

                <th>Amount</th>

                <th>Method</th>

                <th>Status</th>

                <th>Date</th>

                <th>Actions</th>
              </tr>
            </thead>

            <tbody id="paymentsTable"></tbody>
          </table>
        </div>
      </main>
    </div>
    <div class="modal fade" id="payPaymentModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content dark-modal">
          <div class="modal-header border-0">
            <h5 class="modal-title">Pay Payment</h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="payPaymentId" />
            <div class="mb-3">
              <label for="paymentMethodSelect" class="form-label">Payment Method</label>
              <select id="paymentMethodSelect" class="form-select">
                <option value="Cash">Cash</option>
                <option value="Visa">Visa</option>
                <option value="VodafoneCash">Vodafone Cash</option>
                <option value="OrangeCash">Orange Cash</option>
                <option value="EtisalatCash">Etisalat Cash</option>
                <option value="Fawry">Fawry</option>
              </select>
            </div>
            <button id="confirmPayBtn" class="btn btn-pay w-100">Confirm Payment</button>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../shared/ui.js"></script>
    <script src="payments.js"></script>
  </body>
</html>
