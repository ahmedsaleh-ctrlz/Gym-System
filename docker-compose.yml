services:
  gym.api:
    container_name: gym-api
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      gym.db:
        condition: service_healthy
      seq:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:80
      ConnectionStrings__DefaultConnection: Server=gym.db,1433;Database=GymDB;User Id=sa;Password=Your_password123!;TrustServerCertificate=True;MultipleActiveResultSets=true;
      Serilog__WriteTo__1__Args__serverUrl: http://seq:5341
      JwtSettings__Issuer: gym-api
      JwtSettings__Audience: gym-api
    ports:
      - "8080:80"
    restart: unless-stopped
    networks:
      - gym-network

  gym.db:
    container_name: gym-db
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: Your_password123!
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\" -C || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - gym-network

  seq:
    container_name: gym-seq
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "5341:5341"
      - "8081:80"
    volumes:
      - seq-data:/data
    restart: unless-stopped
    networks:
      - gym-network

volumes:
  sqlserver-data:
  seq-data:

networks:
  gym-network:
    driver: bridge
